<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>onedayonevibe — Top 5 Releases</title>
<style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0d0d0d; color: #fff; min-height: 100vh; padding: 20px; }
    .container { max-width: 600px; margin: 0 auto; padding: 20px 0; }
    h1 { font-size: 28px; font-weight: 800; color: #00BFFF; margin-bottom: 4px; }
    .subtitle { font-size: 14px; color: #666; margin-bottom: 30px; }
    .card { background: #1a1a1a; border-radius: 12px; padding: 20px; margin-bottom: 16px; }
    .card h2 { font-size: 14px; font-weight: 600; color: #00BFFF; margin-bottom: 16px; text-transform: uppercase; letter-spacing: 1px; }
    label { display: block; font-size: 13px; color: #999; margin-bottom: 6px; }
    input, select, textarea { width: 100%; background: #2a2a2a; border: 1px solid #333; border-radius: 8px; padding: 12px; color: #fff; font-size: 15px; margin-bottom: 14px; outline: none; font-family: inherit; }
    input:focus, select:focus, textarea:focus { border-color: #00BFFF; }
    .btn { width: 100%; padding: 16px; border-radius: 10px; font-size: 16px; font-weight: 700; cursor: pointer; border: none; margin-bottom: 12px; }
    .btn:active { opacity: 0.8; }
    .btn-green { background: #1DB954; color: #000; }
    .btn-secondary { background: #2a2a2a; color: #fff; border: 1px solid #444; }
    .btn-danger { background: #ff4444; color: #fff; }
    .status { background: #1a1a1a; border-radius: 12px; padding: 16px; margin-bottom: 16px; display: none; }
    .status.visible { display: block; }
    .status-text { font-size: 14px; line-height: 1.6; }
    .status-ok { color: #00ff88; }
    .status-error { color: #ff4444; }
    .status-info { color: #00BFFF; }
    .track { background: #222; border-radius: 10px; padding: 14px; margin-bottom: 12px; border-left: 4px solid #00BFFF; }
    .track-head { font-size: 15px; font-weight: 700; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
    .track-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .track-grid input { margin-bottom: 0; font-size: 13px; padding: 10px; }
    .track-full { margin-top: 8px; }
    .track-full input { margin-bottom: 0; font-size: 13px; padding: 10px; }
    .check-row { display: flex; align-items: center; gap: 8px; margin-top: 10px; }
    .check-row label { margin-bottom: 0; font-size: 13px; color: #ccc; }
    .check-row input[type="checkbox"] { width: auto; margin-bottom: 0; }
</style>
</head>
<body>
<div class="container">
    <h1>@onedayonevibe</h1>
    <p class="subtitle">Top 5 Releases — Generador setmanal</p>

    <div class="card">
        <h2>✏️ Pas 1 — Configuració</h2>
        <label>Gènere</label>
        <select id="genere">
            <option value="electronic">🎧 Electronic Dance</option>
            <option value="hard">🔥 Hard (hardcore, hard techno...)</option>
        </select>
        <label>Text de la setmana (opcional)</label>
        <input type="text" id="setmana_text" placeholder="Week of September 20" />
        <label>Estil de detecció (només per temes sense timestamp)</label>
        <select id="estil">
            <option value="energetic">⚡ Energètic</option>
            <option value="melodic">🎵 Melòdic</option>
            <option value="vocal">🎤 Vocal</option>
        </select>
        <label>🔗 Link general de reserva (opcional — per temes sense videoclip propi)</label>
        <input type="text" id="fons_url" placeholder="https://youtu.be/..." />
    </div>

    <div id="status" class="status">
        <div id="status-text" class="status-text"></div>
    </div>

    <div class="card">
        <h2>🎵 Pas 2 — Els 5 llançaments</h2>
        <label>📋 O enganxa la llista sencera (una per línia, "Nom - Artista")</label>
        <textarea id="llista-paste" rows="5" placeholder="Dragonborn - Headhunterz&#10;The Vandal - Da Tweekaz&#10;Reload - Sebastian Ingrosso &amp; Tommy Trash"></textarea>
        <button class="btn btn-secondary" onclick="omplirDesDeLlista()">📋 Omplir des de la llista</button>

        <div id="tracks-list"></div>
    </div>

    <button class="btn btn-green" onclick="generarVideo()">🎬 Generar vídeo</button>

    <div class="card">
        <h2>⬇️ Descarregar / Esborrar</h2>
        <button class="btn btn-secondary" onclick="veureEstat()">📊 Consultar estat</button>
        <button class="btn btn-secondary" onclick="descarregarFinal()">⬇️ Descarregar vídeo final</button>
        <button class="btn btn-danger" onclick="esborrarRelease()">🗑️ Esborrar Release</button>
        <button class="btn btn-secondary" onclick="canviarToken()">🔑 Canviar token</button>
    </div>
</div>

<script>
const GITHUB_REPO = "nilburgas-eng/onedayonevibe";
let GITHUB_TOKEN = localStorage.getItem('github_token') || '';
let tracksActuals = [];

window.onload = function() {
    if (!GITHUB_TOKEN) {
        GITHUB_TOKEN = prompt('Introdueix el teu GitHub Token:');
        if (GITHUB_TOKEN) localStorage.setItem('github_token', GITHUB_TOKEN);
    }
    for (let i = 0; i < 5; i++) afegirTrack();
}

function canviarToken() {
    const nou = prompt('Introdueix el nou GitHub Token:');
    if (nou) {
        GITHUB_TOKEN = nou;
        localStorage.setItem('github_token', nou);
        mostrarStatus('✅ Token actualitzat!', 'ok');
    }
}

function mostrarStatus(text, tipus) {
    const el = document.getElementById('status');
    const textEl = document.getElementById('status-text');
    el.classList.add('visible');
    textEl.innerHTML = `<span class="status-${tipus}">${text}</span>`;
}

function parseTimestamp(ts) {
    if (!ts || ts.trim() === '') return null;
    const parts = ts.split(':');
    if (parts.length === 2) return parseInt(parts[0]) * 60 + parseInt(parts[1]);
    if (parts.length === 3) return parseInt(parts[0]) * 3600 + parseInt(parts[1]) * 60 + parseInt(parts[2]);
    return null;
}

function segonsAStr(s) {
    if (s === null || s === undefined) return '';
    const m = Math.floor(s / 60);
    const seg = Math.floor(s % 60);
    return `${m}:${seg.toString().padStart(2,'0')}`;
}

async function dispararWorkflow(workflow, inputs) {
    const r = await fetch(
        `https://api.github.com/repos/${GITHUB_REPO}/actions/workflows/${workflow}/dispatches`,
        {
            method: 'POST',
            headers: { 'Authorization': `token ${GITHUB_TOKEN}`, 'Content-Type': 'application/json' },
            body: JSON.stringify({ ref: 'main', inputs })
        }
    );
    let detall = '';
    if (r.status !== 204) {
        try { detall = (await r.json()).message || ''; } catch(e) {}
    }
    return { status: r.status, detall };
}

function renderTracks() {
    const cont = document.getElementById('tracks-list');
    cont.innerHTML = '';
    tracksActuals.forEach((t, i) => {
        const div = document.createElement('div');
        div.className = 'track';
        div.innerHTML = `
            <div class="track-head">
                <span>#${t.pos}</span>
                <button onclick="obrirYoutube(${i})" style="background:#00BFFF;color:#000;border:none;border-radius:5px;padding:3px 10px;font-size:14px;font-weight:700;cursor:pointer;">🎬</button>
            </div>
            <div class="track-full">
                <input type="text" placeholder="Nom cançó" value="${(t.nom||'').replace(/"/g,'&quot;')}" onchange="actualitzar(${i}, 'nom', this.value)" />
            </div>
            <div class="track-full">
                <input type="text" placeholder="Artista" value="${(t.artista||'').replace(/"/g,'&quot;')}" onchange="actualitzar(${i}, 'artista', this.value)" />
            </div>
            <div class="track-grid">
                <input type="text" placeholder="Timestamp (mm:ss, opcional)" value="${segonsAStr(t.timestamp_manual)}" onchange="actualitzar(${i}, 'ts', this.value)" />
                <input type="text" placeholder="URL YouTube (opcional)" value="${t.yt_url||''}" onchange="actualitzar(${i}, 'yt', this.value)" />
            </div>
            <div class="check-row">
                <input type="checkbox" id="vg-${i}" ${t.visual_general ? 'checked' : ''} onchange="actualitzar(${i}, 'visual_general', this.checked)" />
                <label for="vg-${i}">Usar imatge del link general (videoclip estàtic o no m'agrada)</label>
            </div>
        `;
        cont.appendChild(div);
    });
}

function obrirYoutube(i) {
    const t = tracksActuals[i];
    const url = t.yt_url
        ? t.yt_url
        : `https://www.youtube.com/results?search_query=${encodeURIComponent(`${t.artista} ${t.nom} official video`)}`;
    const a = document.createElement('a');
    a.href = url;
    a.target = '_blank';
    a.rel = 'noopener noreferrer';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
}

function actualitzar(i, camp, valor) {
    if (camp === 'ts') tracksActuals[i].timestamp_manual = parseTimestamp(valor);
    else if (camp === 'nom') tracksActuals[i].nom = valor.trim();
    else if (camp === 'artista') tracksActuals[i].artista = valor.trim();
    else if (camp === 'yt') tracksActuals[i].yt_url = valor.trim() || null;
    else if (camp === 'visual_general') tracksActuals[i].visual_general = valor;
}

function omplirDesDeLlista() {
    const raw = document.getElementById('llista-paste').value;
    const linies = raw.split('\n').map(l => l.trim()).filter(l => l.length > 0);
    if (linies.length === 0) {
        mostrarStatus('❌ La llista és buida', 'error');
        return;
    }
    let comptador = 0;
    linies.forEach((linia, i) => {
        const neta = linia.replace(/^\s*\d+\s*[\.\)\:]\s*/, '').trim();
        let nom = neta;
        let artista = '';
        const idx = neta.indexOf(' - ');
        if (idx !== -1) {
            nom = neta.slice(0, idx).trim();
            artista = neta.slice(idx + 3).trim();
        }
        if (!nom) return;
        if (tracksActuals[i]) {
            tracksActuals[i].nom = nom;
            tracksActuals[i].artista = artista;
        } else {
            tracksActuals.push({
                pos: tracksActuals.length + 1,
                nom, artista,
                timestamp_manual: null, yt_url: null, visual_general: false
            });
        }
        comptador++;
    });
    renderTracks();
    mostrarStatus(`✅ ${comptador} llançaments omplerts des de la llista.`, 'ok');
}

function afegirTrack() {
    tracksActuals.push({
        pos: tracksActuals.length + 1,
        nom: '', artista: '',
        timestamp_manual: null, yt_url: null, visual_general: false
    });
    renderTracks();
}

function netejarTracks() {
    return tracksActuals.map(t => {
        const o = { pos: t.pos, nom: t.nom, artista: t.artista };
        if (t.timestamp_manual !== null && t.timestamp_manual !== undefined) o.timestamp_manual = t.timestamp_manual;
        if (t.yt_url) o.yt_url = t.yt_url;
        if (t.visual_general) o.visual_general = true;
        return o;
    });
}

async function generarVideo() {
    const tracksValids = tracksActuals.filter(t => t.nom && t.nom.trim());
    if (tracksValids.length < 2) {
        mostrarStatus('❌ Omple com a mínim 2 llançaments (nom i artista)', 'error');
        return;
    }
    const genere = document.getElementById('genere').value;
    const setmanaText = document.getElementById('setmana_text').value.trim();
    const estil = document.getElementById('estil').value;
    const fonsUrl = document.getElementById('fons_url').value.trim();
    mostrarStatus('⏳ Generant vídeo...', 'info');
    const res = await dispararWorkflow('top5releases.yml', {
        genere,
        setmana_text: setmanaText,
        estil,
        fons_url: fonsUrl,
        tracks: JSON.stringify(netejarTracks())
    });
    if (res.status === 204) {
        mostrarStatus('✅ Generació iniciada!<br>⏳ Tarda uns minuts. Després "Descarregar vídeo final".', 'ok');
    } else {
        mostrarStatus(`❌ Error ${res.status}: ${res.detall}`, 'error');
    }
}

async function veureEstat() {
    mostrarStatus('⏳ Consultant estat...', 'info');
    const r = await fetch(
        `https://api.github.com/repos/${GITHUB_REPO}/actions/runs?per_page=5`,
        { headers: { 'Authorization': `token ${GITHUB_TOKEN}` } }
    );
    const data = await r.json();
    const runs = data.workflow_runs;
    if (!runs || runs.length === 0) { mostrarStatus('❌ No hi ha workflows recents', 'error'); return; }
    let html = '<b>Últims workflows:</b><br><br>';
    for (const run of runs) {
        const icon = run.status === 'completed' ? (run.conclusion === 'success' ? '✅' : '❌') : '⏳';
        html += `${icon} <b>${run.name}</b> — ${run.conclusion || run.status}<br>`;
        html += `&nbsp;&nbsp;&nbsp;${new Date(run.created_at).toLocaleString()}<br><br>`;
    }
    mostrarStatus(html, 'info');
}

async function descarregarFinal() {
    const r = await fetch(
        `https://api.github.com/repos/${GITHUB_REPO}/releases/tags/top5releases_generat`,
        { headers: { 'Authorization': `token ${GITHUB_TOKEN}` } }
    );
    if (r.status !== 200) { mostrarStatus('❌ Release no trobat', 'error'); return; }
    const release = await r.json();
    const asset = release.assets.find(a => a.name === 'top5releases_final.mp4');
    if (asset) window.open(asset.browser_download_url, '_blank');
    else mostrarStatus('❌ Vídeo final no trobat encara', 'error');
}

async function esborrarRelease() {
    mostrarStatus('⏳ Esborrant...', 'info');
    const r = await fetch(
        `https://api.github.com/repos/${GITHUB_REPO}/releases/tags/top5releases_generat`,
        { headers: { 'Authorization': `token ${GITHUB_TOKEN}` } }
    );
    if (r.status !== 200) { mostrarStatus('❌ Release no trobat', 'error'); return; }
    const release = await r.json();
    await fetch(`https://api.github.com/repos/${GITHUB_REPO}/releases/${release.id}`,
        { method: 'DELETE', headers: { 'Authorization': `token ${GITHUB_TOKEN}` } });
    await fetch(`https://api.github.com/repos/${GITHUB_REPO}/git/refs/tags/top5releases_generat`,
        { method: 'DELETE', headers: { 'Authorization': `token ${GITHUB_TOKEN}` } });
    mostrarStatus('✅ Release esborrat!', 'ok');
}
</script>
</body>
</html>
