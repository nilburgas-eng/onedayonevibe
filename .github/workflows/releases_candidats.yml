name: Releases Candidats

on:
  workflow_dispatch:
    inputs:
      data:
        description: 'Data a provar (AAAA-MM-DD). Buit = avui'
        required: false
        default: ''
      dies:
        description: 'Dies enrere per a la playlist (2 = avui i ahir; 30 per omplir-la el primer cop)'
        required: false
        default: '2'
      playlist:
        description: 'Afegir els millors temes del dia a la playlist de Spotify: si o no (per defecte no)'
        required: false
        default: 'no'
  schedule:
    # matí i migdia: només proposen candidats (no toquen la playlist)
    - cron: '17 6 * * *'
    - cron: '17 12 * * *'
    # divendres al vespre (21:17 hivern / 22:17 estiu, hora de Catalunya): proposa candidats i
    # afegeix a la playlist els 5 millors del dia, quan HDRR ja ha classificat els llançaments
    - cron: '17 20 * * 5'

jobs:
  candidats:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout codi
        uses: actions/checkout@v4

      - name: Instal·lar dependencies
        run: pip install requests

      - name: Buscar candidats del dia
        env:
          DATA: ${{ github.event.inputs.data }}
          # divendres al vespre només es mira el dia d'avui (així no s'afegeix res de dijous)
          DIES: ${{ github.event.schedule == '17 20 * * 5' && '1' || github.event.inputs.dies || '2' }}
        run: python3 releases_candidats.py

      - name: Actualitzar la playlist de Spotify
        # només el cron de divendres al vespre, o una execució manual amb playlist = si
        if: ${{ github.event.schedule == '17 20 * * 5' || (github.event_name == 'workflow_dispatch' && github.event.inputs.playlist == 'si' && github.event.inputs.data == '') }}
        continue-on-error: true
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.ODOV_SPOTIFY_CLIENT_ID }}
          SPOTIFY_REFRESH_TOKEN: ${{ secrets.ODOV_SPOTIFY_REFRESH_TOKEN }}
          SPOTIFY_PLAYLIST_ID: ${{ secrets.ODOV_SPOTIFY_PLAYLIST_ID }}
        run: python3 releases_playlist.py

      - name: Guardar resultats
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for f in releases_candidats.json releases_playlist_log.json releases_cache.json; do
            [ -f "$f" ] && git add "$f"
          done
          git diff --cached --quiet || git commit -m "Releases: candidats i playlist"
          git pull --rebase origin main || true
          git push
