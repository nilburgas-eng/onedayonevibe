<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>onedayonevibe — Notícia</title>
<style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0d0d0d; color: #fff; min-height: 100vh; padding: 20px; }
    .container { max-width: 600px; margin: 0 auto; padding: 20px 0; }
    h1 { font-size: 28px; font-weight: 800; color: #00BFFF; margin-bottom: 4px; }
    .subtitle { font-size: 14px; color: #666; margin-bottom: 30px; }
    .card { background: #1a1a1a; border-radius: 12px; padding: 20px; margin-bottom: 16px; }
    .card h2 { font-size: 14px; font-weight: 600; color: #00BFFF; margin-bottom: 16px; text-transform: uppercase; letter-spacing: 1px; }
    label { display: block; font-size: 13px; color: #999; margin-bottom: 6px; }
    input, select { width: 100%; background: #2a2a2a; border: 1px solid #333; border-radius: 8px; padding: 12px; color: #fff; font-size: 15px; margin-bottom: 14px; outline: none; }
    input:focus, select:focus { border-color: #00BFFF; }
    .btn { width: 100%; padding: 16px; border-radius: 10px; font-size: 16px; font-weight: 700; cursor: pointer; border: none; margin-bottom: 12px; }
    .btn:active { opacity: 0.8; }
    .btn-green { background: #1DB954; color: #000; }
    .btn-secondary { background: #2a2a2a; color: #fff; border: 1px solid #444; }
    .btn-danger { background: #ff4444; color: #fff; }
    .status { background: #1a1a1a; border-radius: 12px; padding: 16px; margin-bottom: 16px; display: none; }
    .status.visible { display: block; }
    .status-text { font-size: 14px; line-height: 1.6; }
    .status-ok { color: #00ff88; }
    .status-error { color: #ff4444; }
    .status-info { color: #00BFFF; }
    .preview { background: #111; border-radius: 8px; padding: 14px; font-size: 13px; color: #888; margin-bottom: 14px; text-align: center; }
</style>
</head>
<body>
<div class="container">
    <h1>@onedayonevibe</h1>
    <p class="subtitle">Notícia — Aniversari d'artista o tema</p>

    <div class="card">
        <h2>📰 Dades</h2>
        <label>Tipus</label>
        <select id="tipus" onchange="actualitzarPreview()">
            <option value="tema">🎵 Tema (llançament)</option>
            <option value="artista">🧑 Artista (naixement)</option>
        </select>
        <label id="label_nom">Nom del tema</label>
        <input type="text" id="nom" placeholder="Sandstorm" onchange="actualitzarPreview()" />
        <div id="bloc_artista">
            <label>Artista</label>
            <input type="text" id="artista" placeholder="Darude" onchange="actualitzarPreview()" />
        </div>
        <label id="label_data">Data de llançament</label>
        <input type="date" id="data" onchange="actualitzarPreview()" />
        <div id="preview" class="preview">Omple les dades per veure el resultat</div>
    </div>

    <div class="card">
        <h2>🎥 Vídeo de fons</h2>
        <label>URL de YouTube</label>
        <input type="text" id="yt_url" placeholder="https://youtube.com/watch?v=..." />
        <label>Timestamp (mm:ss)</label>
        <input type="text" id="timestamp" placeholder="1:20" />
        <label>O puja un vídeo propi (opcional)</label>
        <input type="file" accept="video/*" onchange="pujarVideoManual(this)" />
        <div id="video-status" style="font-size:12px;color:#666;margin-top:-6px;margin-bottom:10px;"></div>
        <label>Durada del clip (segons)</label>
        <input type="text" id="durada" value="10" />
    </div>

    <div id="status" class="status">
        <div id="status-text" class="status-text"></div>
    </div>

    <div class="card">
        <button class="btn btn-green" onclick="generarVideo()">🎬 Generar vídeo</button>
        <button class="btn btn-secondary" onclick="veureEstat()">📊 Consultar estat</button>
        <button class="btn btn-secondary" onclick="descarregarFinal()">⬇️ Descarregar vídeo final</button>
        <button class="btn btn-danger" onclick="esborrarRelease()">🗑️ Esborrar Release</button>
        <button class="btn btn-secondary" onclick="canviarToken()">🔑 Canviar token</button>
    </div>
</div>

<script>
const GITHUB_REPO = "nilburgas-eng/onedayonevibe";
let GITHUB_TOKEN = localStorage.getItem('github_token') || '';
let videoManualUrl = null;

window.onload = function() {
    if (!GITHUB_TOKEN) {
        GITHUB_TOKEN = prompt('Introdueix el teu GitHub Token:');
        if (GITHUB_TOKEN) localStorage.setItem('github_token', GITHUB_TOKEN);
    }
    actualitzarPreview();
}

function canviarToken() {
    const nou = prompt('Introdueix el nou GitHub Token:');
    if (nou) {
        GITHUB_TOKEN = nou;
        localStorage.setItem('github_token', nou);
        mostrarStatus('✅ Token actualitzat!', 'ok');
    }
}

function mostrarStatus(text, tipus) {
    const el = document.getElementById('status');
    const textEl = document.getElementById('status-text');
    el.classList.add('visible');
    textEl.innerHTML = `<span class="status-${tipus}">${text}</span>`;
}

function actualitzarPreview() {
    const tipus = document.getElementById('tipus').value;
    const nom = document.getElementById('nom').value.trim();
    const artista = document.getElementById('artista').value.trim();
    const dataStr = document.getElementById('data').value;

    document.getElementById('label_nom').textContent = tipus === 'artista' ? "Nom de l'artista" : 'Nom del tema';
    document.getElementById('label_data').textContent = tipus === 'artista' ? 'Data de naixement' : 'Data de llançament';
    document.getElementById('bloc_artista').style.display = tipus === 'tema' ? 'block' : 'none';

    const prev = document.getElementById('preview');
    if (!nom || !dataStr) {
        prev.textContent = 'Omple les dades per veure el resultat';
        return;
    }
    const data = new Date(dataStr + 'T00:00:00');
    const avui = new Date();
    let anys = avui.getFullYear() - data.getFullYear();
    const encaraNoHaArribat = (avui.getMonth() < data.getMonth()) || (avui.getMonth() === data.getMonth() && avui.getDate() < data.getDate());
    if (encaraNoHaArribat) anys -= 1;
    const verb = tipus === 'artista' ? 'WAS BORN' : 'WAS RELEASED';
    prev.innerHTML = `ON THIS DAY<br><b style="font-size:18px;color:#fff;">${anys} YEARS AGO</b><br><b style="color:#00BFFF;">${nom.toUpperCase()} ${verb}</b>`;
}

function parseTimestamp(ts) {
    if (!ts || ts.trim() === '') return null;
    const parts = ts.split(':');
    if (parts.length === 2) return parseInt(parts[0]) * 60 + parseInt(parts[1]);
    if (parts.length === 3) return parseInt(parts[0]) * 3600 + parseInt(parts[1]) * 60 + parseInt(parts[2]);
    return null;
}

let releaseManualId = null;

async function obtenirReleaseManual() {
    if (releaseManualId) return releaseManualId;
    let r = await fetch(`https://api.github.com/repos/${GITHUB_REPO}/releases/tags/manual-media`, {
        headers: { 'Authorization': `token ${GITHUB_TOKEN}` }
    });
    if (r.status === 200) {
        const data = await r.json();
        releaseManualId = data.id;
        return releaseManualId;
    }
    r = await fetch(`https://api.github.com/repos/${GITHUB_REPO}/releases`, {
        method: 'POST',
        headers: { 'Authorization': `token ${GITHUB_TOKEN}`, 'Content-Type': 'application/json' },
        body: JSON.stringify({
            tag_name: 'manual-media',
            name: 'Vídeos i portades pujats manualment',
            body: 'No esborris aquest release: aquí es guarden els vídeos/portades manuals dels formats.',
            prerelease: true
        })
    });
    if (r.status === 201) {
        const data = await r.json();
        releaseManualId = data.id;
        return releaseManualId;
    }
    throw new Error('No s\'ha pogut crear/trobar el release per als fitxers manuals');
}

async function pujarVideoManual(inputEl) {
    const file = inputEl.files[0];
    if (!file) return;
    if (file.size > 500 * 1024 * 1024) {
        mostrarStatus('❌ Vídeo massa gran (màxim ~500MB)', 'error');
        inputEl.value = '';
        return;
    }
    mostrarStatus(`⏳ Pujant vídeo (${(file.size/1024/1024).toFixed(1)} MB)... pot trigar una estona.`, 'info');
    try {
        const releaseId = await obtenirReleaseManual();
        const extensio = (file.name.split('.').pop() || 'mp4').toLowerCase().replace(/[^a-z0-9]/g, '') || 'mp4';
        const nomFitxer = `noticia_${Date.now()}.${extensio}`;
        const r = await fetch(
            `https://uploads.github.com/repos/${GITHUB_REPO}/releases/${releaseId}/assets?name=${encodeURIComponent(nomFitxer)}`,
            {
                method: 'POST',
                headers: { 'Authorization': `token ${GITHUB_TOKEN}`, 'Content-Type': file.type || 'application/octet-stream' },
                body: file
            }
        );
        if (r.status === 201) {
            const data = await r.json();
            videoManualUrl = data.browser_download_url;
            document.getElementById('video-status').style.color = '#00ff88';
            document.getElementById('video-status').innerHTML = `✅ Video manual: ${nomFitxer}`;
            mostrarStatus('✅ Vídeo pujat correctament!', 'ok');
        } else {
            const err = await r.json().catch(() => ({}));
            mostrarStatus(`❌ Error pujant vídeo (${r.status}): ${err.message || ''}`, 'error');
        }
    } catch (e) {
        mostrarStatus('❌ Error: ' + e.message, 'error');
    }
}

async function dispararWorkflow(workflow, inputs) {
    const r = await fetch(
        `https://api.github.com/repos/${GITHUB_REPO}/actions/workflows/${workflow}/dispatches`,
        {
            method: 'POST',
            headers: { 'Authorization': `token ${GITHUB_TOKEN}`, 'Content-Type': 'application/json' },
            body: JSON.stringify({ ref: 'main', inputs })
        }
    );
    let detall = '';
    if (r.status !== 204) {
        try { detall = (await r.json()).message || ''; } catch(e) {}
    }
    return { status: r.status, detall };
}

async function generarVideo() {
    const tipus = document.getElementById('tipus').value;
    const nom = document.getElementById('nom').value.trim();
    const artista = document.getElementById('artista').value.trim();
    const dataStr = document.getElementById('data').value;
    const ytUrl = document.getElementById('yt_url').value.trim();
    const timestamp = parseTimestamp(document.getElementById('timestamp').value);
    const durada = document.getElementById('durada').value.trim() || '10';

    if (!nom || !dataStr) {
        mostrarStatus('❌ Omple el nom i la data', 'error');
        return;
    }
    if (!ytUrl && !videoManualUrl) {
        mostrarStatus('❌ Cal una URL de YouTube o un vídeo propi', 'error');
        return;
    }

    mostrarStatus('⏳ Generant vídeo...', 'info');
    const res = await dispararWorkflow('noticia.yml', {
        tipus, nom, artista, data: dataStr,
        yt_url: ytUrl,
        video_manual: videoManualUrl || '',
        timestamp_manual: timestamp !== null ? String(timestamp) : '',
        durada
    });
    if (res.status === 204) {
        mostrarStatus('✅ Generació iniciada!<br>⏳ Tarda 5-10 min. Després "Descarregar vídeo final".', 'ok');
    } else {
        mostrarStatus(`❌ Error ${res.status}: ${res.detall}`, 'error');
    }
}

async function veureEstat() {
    mostrarStatus('⏳ Consultant estat...', 'info');
    const r = await fetch(
        `https://api.github.com/repos/${GITHUB_REPO}/actions/runs?per_page=5`,
        { headers: { 'Authorization': `token ${GITHUB_TOKEN}` } }
    );
    const data = await r.json();
    const runs = data.workflow_runs;
    if (!runs || runs.length === 0) { mostrarStatus('❌ No hi ha workflows recents', 'error'); return; }
    let html = '<b>Últims workflows:</b><br><br>';
    for (const run of runs) {
        const icon = run.status === 'completed' ? (run.conclusion === 'success' ? '✅' : '❌') : '⏳';
        html += `${icon} <b>${run.name}</b> — ${run.conclusion || run.status}<br>`;
        html += `&nbsp;&nbsp;&nbsp;${new Date(run.created_at).toLocaleString()}<br><br>`;
    }
    mostrarStatus(html, 'info');
}

async function descarregarFinal() {
    const r = await fetch(
        `https://api.github.com/repos/${GITHUB_REPO}/releases/tags/noticia_generat`,
        { headers: { 'Authorization': `token ${GITHUB_TOKEN}` } }
    );
    if (r.status !== 200) { mostrarStatus('❌ Release no trobat', 'error'); return; }
    const release = await r.json();
    const asset = release.assets.find(a => a.name === 'noticia_final.mp4');
    if (asset) window.open(asset.browser_download_url, '_blank');
    else mostrarStatus('❌ Vídeo final no trobat encara', 'error');
}

async function esborrarRelease() {
    mostrarStatus('⏳ Esborrant...', 'info');
    const r = await fetch(
        `https://api.github.com/repos/${GITHUB_REPO}/releases/tags/noticia_generat`,
        { headers: { 'Authorization': `token ${GITHUB_TOKEN}` } }
    );
    if (r.status !== 200) { mostrarStatus('❌ Release no trobat', 'error'); return; }
    const release = await r.json();
    await fetch(`https://api.github.com/repos/${GITHUB_REPO}/releases/${release.id}`,
        { method: 'DELETE', headers: { 'Authorization': `token ${GITHUB_TOKEN}` } });
    await fetch(`https://api.github.com/repos/${GITHUB_REPO}/git/refs/tags/noticia_generat`,
        { method: 'DELETE', headers: { 'Authorization': `token ${GITHUB_TOKEN}` } });
    mostrarStatus('✅ Release esborrat!', 'ok');
}
</script>
</body>
</html>
